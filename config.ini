# Ball Collision Engine runtime settings
#
# Radius values are in pixels and are inclusive. Use the same minimum and
# maximum to give every ball a fixed size.
ball_radius_min = 2
ball_radius_max = 3

# Options: random, circle_cluster, rectangle_cluster
# Cluster modes tightly pack every ball using ball_radius_min.
pattern_mode = rectangle_cluster

# Multiplier applied to the right-drag distance when launching a ball.
right_drag_launch_speed = 60.0

# Options: none, normal, center, bicenter
# "none" disables gravitational acceleration.
gravity = none

# Multiplier for normal, center, and bicenter gravitational acceleration.
# 0 disables gravitational acceleration; 1.2 preserves the original behavior.
gravity_strength = 1.2

# Velocity damping per second. Use 0 for space-like coasting. (like fraction)
velocity_drag = 0.6

num_balls = 8000

# Hold Q / E to pull / push balls near the cursor. The acceleration is
# strongest at the cursor and fades to zero at the radius (pixels).
mouse_force_strength = 4000.0
mouse_force_radius = 200.0

# Thickness (radius in pixels) of walls drawn with a right-drag.
wall_radius = 4.0
